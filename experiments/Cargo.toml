[package]
name = "flodl-bio-experiments"
version = "0.1.0"
edition = "2021"
publish = false
description = "Reproduces the evaluation of the flodl-bio application note"

[features]
# Train on the GPU (CUDA libtorch).
cuda = ["flodl-bio/cuda"]

[dependencies]
flodl-bio = { path = "..", features = ["flodl"] }
serde_json = "1"
