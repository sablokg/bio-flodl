[package]
name = "bio-flodl-experiments"
version = "0.1.0"
edition = "2021"
publish = false
description = "Reproduces the evaluation of the bio-flodl application note"

[features]
# Train on the GPU (CUDA libtorch).
cuda = ["bio-flodl/cuda"]

[dependencies]
bio-flodl = { path = "..", features = ["flodl"] }
serde_json = "1"
